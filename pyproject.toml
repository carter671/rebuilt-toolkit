[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuilt"
version = "0.1.0"
description = "Rebuilt architectural reconstruction system: Capture, Genome, MODEL, Export"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "numpy>=1.26", "manifold3d==3.5.4", "ifcopenshell==0.9.0.post1",
  "pygltflib>=1.16", "matplotlib>=3.8", "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rebuilt = "rebuilt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
rebuilt = ["takeoff/*.html"]
